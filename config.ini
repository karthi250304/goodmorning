; ---------------------------------------------------------------------------
; Telegram_GoodMorning configuration
; NO SECRETS GO IN THIS FILE.
; The HRMS password and the Telegram bot token are stored in Windows
; Credential Manager by:   setup.bat   (or: python main.py --setup-credentials)
; ---------------------------------------------------------------------------

[hrms]
login_url = https://edm.bipinexports.co.in/hrms/auth/login
movements_url = https://edm.bipinexports.co.in/hrms/emp/empmovements
; The username you type on the HRMS login page (not a secret).
username =
; Employee whose FIRST movement (Movement Count = 1) is read.
employee_code = 8933
login_requires_punch = true
; OPTIONAL: HRMS password in plain text. If set, it is used instead of Windows Credential Manager.
; Less secure: anyone who can open this file can read it. Leave empty to use Credential Manager.
password =

[schedule]
timezone = Asia/Kolkata
; First IN time must be between start_time and end_time (inclusive).
start_time = 08:40
end_time = 10.00
check_interval_seconds = 120
; The script keeps checking this many minutes after end_time, because the
; decision is based on the IN time shown by HRMS, not on the PC clock
; (covers an IN at 10:59 that HRMS shows a minute later).
final_grace_minutes = 2
; If a qualifying IN was found but Telegram could not be reached, keep
; retrying (safe, never-delivered failures only) until end_time + this.
send_retry_extra_minutes = 15

[browser]
; false = Chrome window is visible (use while testing).
; true  = invisible Chrome (recommended once everything works).
headless = true
page_timeout_seconds = 60
element_timeout_seconds = 30
; Seconds to let the page finish loading its table (PHP/AJAX) after load.
settle_seconds = 3
; Leave empty: Selenium Manager downloads a matching chromedriver itself.
; If your office network blocks that, put the full path of chromedriver.exe.
chromedriver_path =
; Server only, optional: full path of the Chrome/Chromium binary if it is not found automatically.
chrome_binary =

[runner]
; Used by scheduler.py (server). main.py ignores this section.
days = MON,TUE,WED,THU,FRI,SAT
launch_minutes_before = 5
max_restarts_per_day = 5
restart_delay_seconds = 60

[page]
; Formats HRMS may use to display the date in #attendancedate (comma separated).
date_formats = %d-%m-%Y,%d/%m/%Y,%Y-%m-%d,%d-%b-%Y,%d %b %Y,%d-%m-%y,%d %B %Y
; Format used if the script has to type today's date into the field.
date_input_format = %d-%m-%Y
; OPTIONAL CSS selector of the page's Search/Submit button, only needed if the
; page does not reload the table by itself after the date changes.
; Example:  search_button_selector = #btnsearch
search_button_selector =

[telegram]
; user = post from YOUR OWN Telegram account (you must already be in the group). No bot needed.
; bot  = post as a bot (the bot must be added to the group).
mode = user
; For a safe test set chat_id = me  (messages go to your own Saved Messages).
; Numeric group id, e.g. -1001234567890 (supergroup) or -123456789 (basic group).
chat_id =
