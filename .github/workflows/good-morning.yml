name: good-morning

on:
  schedule:
    # UTC. 02:27 UTC = 07:57 IST: main run (waits for 08:00, then checks every 2 minutes until the
    # message is sent or 11:02 IST). The two later times are BACKUPS in case the first one never started.
    - cron: "27 2 * * 1-6"
    - cron: "17 3 * * 1-6"
    - cron: "17 4 * * 1-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (one check, send NOTHING)"
        type: boolean
        default: true

# Scheduled runs never overlap each other; manual runs have their own lane.
concurrency:
  group: good-morning-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run if config.ini contains a password
        run: |
          if grep -Eq '^password[[:space:]]*=[[:space:]]*[^[:space:]]' config.ini; then
            echo "Remove the password from config.ini"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check HRMS and send Good Morning
        env:
          LOG_TO_CONSOLE: "1"
          HRMS_PASSWORD: ${{ secrets.HRMS_PASSWORD }}
          HRMS_USERNAME: ${{ secrets.HRMS_USERNAME }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS=""                       # loop: check every 2 minutes until sent
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--once --dry-run"       # manual test: one check, sends nothing
          else
            ARGS="--once"                 # manual "send now": one check, sends if the IN qualifies
          fi
          python main.py $ARGS
