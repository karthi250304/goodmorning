name: good-morning

on:
  schedule:
    - cron: "30,45 2 * * 1-6"
    - cron: "0,15,30,45 3,4 * * 1-6"
    - cron: "0,15,30 5 * * 1-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (read HRMS, send NOTHING)"
        type: boolean
        default: true

concurrency:
  group: good-morning
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run if config.ini contains a password
        run: |
          if grep -Eq '^password[[:space:]]*=[[:space:]]*[^[:space:]]' config.ini; then
            echo "Remove the password from config.ini"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check HRMS and send Good Morning
        env:
          LOG_TO_CONSOLE: "1"
          HRMS_PASSWORD: ${{ secrets.HRMS_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python main.py --once ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
